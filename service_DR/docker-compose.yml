version: '3.9'

services:

  database:
    container_name: mysql
    image: mysql:5.7.22
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - ${DB_OUT_PORT}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ${DB_DATA}:/var/lib/mysql